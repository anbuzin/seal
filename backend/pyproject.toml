[project]
name = "backend"
version = "0.1.0"
description = "Seal – personal AI assistant backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "vercel>=0.9.0",
    "asyncpg>=0.29.0",
    "httpx>=0.28.1",
    "ai[otel]>=0.4.1",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[tool.vercel]
entrypoint = "app.server:app"

# rotor drives its worker from a queue subscriber (the queue is the clock;
# SQL is authoritative). This replaces the [[tool.vercel.workflows]] block.
[[tool.vercel.subscribers]]
entrypoint = "app.worker:worker"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

# vercel ships `vercel._internal` without a py.typed marker; the blob client
# re-exports from it.
[[tool.mypy.overrides]]
module = "vercel._internal.*"
follow_untyped_imports = true

[tool.ty.environment]
python-version = "3.13"
root = ["./"]

[tool.ruff]
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30

[tool.uv]
exclude-newer = "2 days"
exclude-newer-package = { ai = false, vercel = false, vercel-cache = false, vercel-headers = false, vercel-internal-telemetry = false, vercel-oidc = false }

[tool.uv.sources]
ai = { git = "https://github.com/vercel-labs/ai-python", branch = "main" }

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.5",
    # ty 0.0.69 mis-flags fields of a ConfigDict(frozen=False) subclass of a
    # frozen pydantic model as read-only (tests/conftest.py MockProvider).
    "ty==0.0.44",
]
